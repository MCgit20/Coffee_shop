<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- use for responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- link css -->
    <link rel="stylesheet" href="style.css">
    <!-- link js -->
    <script src="index.js" defer></script>
    <!-- link font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
    <!-- link swiper js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <title>MC Keopi</title>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="navigation">
            <a href="index.html" class="brand">
                <img src="img/logo.png" alt="logo">
            </a>

            <div class="menu">
                <div class="btn">
                    <i class="fas fa-times close-btn"></i>
                </div>

                <a href="menu.html">MENU</a>
                <a href="index.html#about">ABOUT</a>
                <a href="index.html#hero-page">REWARDS</a>
                <button 
                    class="btn-2 btn-link"
                    onclick="window.location.href='contact.html'"
                >
                    Contact Us
                </button>
            </div>
        </div>

        <button 
            class="btn-2 btn-nav"
            onclick="window.location.href='contact.html'"
        >
            Contact Us
        </button>
        <div class="btn">
            <i class="fas fa-bars menu-btn"></i>
        </div>
    </nav>
    <!-- Navbar end -->

    <section class="contact">
        <div class="contact-headline">
            <h1>Get in Touch with <b>MC Keopi</b></h1>
            <div class="contact-info">
                <p>+33 7 12 34 56 78</p>
                <p>info@mckeopicafe.com</p>
                <p>123 Place du Café Crème, Paris, France</p>
            </div>

            <form 
              action="https://api.web3forms.com/submit" 
              method="POST" 
              class="contact-form"
            >
              <input 
                type="hidden" 
                name="access_key" 
                value= "f1fb06db-6308-4e69-83e5-fca07aea5c7e"
              />

              <!-- Form Inputs -->
              <input type="text" name="name" placeholder="Name" required>
              <input type="email" name="email" placeholder="Email" required>
              <input type="number" name="number" placeholder="Phone" required>
              <input type="text" name="location" placeholder="Location" required>
              <textarea name="Order" placeholder="Order" required></textarea>
              <button class="btn-2 btn-contact btn-product">Submit</button>
            </form>
        </div>

        <div class="contact-images">
            <img src="img/contact-img-1.png" alt="img"/>
            <img src="img/contact-img-2.png" alt="img"/>
        </div>
    </section>

    <!-- Callout Section -->
    <div class="callout">
        <div>
            <h4>Do You Know We Have A Daily Delivery Service?</h4>
            <i class="fa-solid fa-truck" style="color: white;"></i>
        </div>
        <h1>Elevating Your Morning, One Sip at a Time.</h1>
        <button 
            class="btn-2 btn-callout"
            onclick="window.location.href='contact.html'"
        >
            Contact Us
        </button>
    </div>

    <!-- Footer -->
    <footer>
        <a href="/">
            <h1>MC Keopi</h1>
        </a>

        <div class="socials">
            <!-- Facebook -->
            <a href="https://www.facebook.com/">
                <div class="social-box">
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
            </a>

            <!-- Twitter -->
            <a href="https://x.com/">
                <div class="social-box">
                    <i class="fa-brands fa-x-twitter"></i>
                </div>
            </a>

            <!-- Linkedin -->
            <a href="https://linkedin.com/">
                <div class="social-box">
                    <i class="fa-brands fa-linkedin-in"></i>
                </div>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/">
                <div class="social-box">
                    <i class="fa-brands fa-instagram"></i>
                </div>
            </a>
        </div>
    </footer>
</body>
</html>
